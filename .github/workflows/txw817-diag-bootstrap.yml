name: TXW817 diagnostic bootstrap

on:
  push:
    branches:
      - txw817-diag-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SDK repository
        uses: actions/checkout@v4

      - name: Record repository metadata
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _bootstrap
          git rev-parse HEAD > _bootstrap/commit.txt
          find . -path './.git' -prune -o -type f -printf '%P\t%s\n' | sort > _bootstrap/file-manifest.tsv
          du -sh . > _bootstrap/du.txt

      - name: Archive complete checked-out source
        shell: bash
        run: |
          set -euxo pipefail
          rm -f /tmp/txw81xcam-source.tar.gz /tmp/txw81xcam-source.tar.gz.sha256
          tar -C "$GITHUB_WORKSPACE" --exclude='./.git' -czf /tmp/txw81xcam-source.tar.gz .
          sha256sum /tmp/txw81xcam-source.tar.gz > /tmp/txw81xcam-source.tar.gz.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: txw81xcam-source-snapshot
          path: |
            /tmp/txw81xcam-source.tar.gz
            /tmp/txw81xcam-source.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
