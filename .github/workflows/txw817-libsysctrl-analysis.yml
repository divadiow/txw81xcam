name: TXW817 libsysctrl analysis

on:
  push:
    branches:
      - analysis/txw817-libsysctrl-20260817
    paths:
      - .github/workflows/txw817-libsysctrl-analysis.yml

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out TXW81X SDK mirror
        uses: actions/checkout@v4

      - name: Download C-SKY ABI v2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/cjacker/wm_sdk_w80x/releases/download/init/csky-elfabiv2-tools-x86_64-minilibc-20210423.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors --output /tmp/csky-toolchain.tar.gz "$url"
          mkdir -p /tmp/csky-toolchain
          tar -xzf /tmp/csky-toolchain.tar.gz -C /tmp/csky-toolchain

          echo 'Candidate C-SKY binutils:'
          find /tmp/csky-toolchain -type f \( -name '*-objdump' -o -name '*-readelf' -o -name '*-nm' -o -name '*-ar' \) -print | sort | head -n 120

          objdump="$(find /tmp/csky-toolchain -type f -name '*-objdump' -print -quit)"
          test -n "$objdump"
          chmod +x "$objdump"
          prefix="${objdump%objdump}"

          for tool in ar nm readelf objdump; do
            test -x "${prefix}${tool}"
          done

          echo "CSKY_PREFIX=$prefix" >> "$GITHUB_ENV"
          "${prefix}objdump" --version | head -n 2

      - name: Extract symbols, relocations and exact function disassembly
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/analysis-out"
          work="$RUNNER_TEMP/libsysctrl"
          mkdir -p "$out" "$work"

          AR="${CSKY_PREFIX}ar"
          NM="${CSKY_PREFIX}nm"
          READELF="${CSKY_PREFIX}readelf"
          OBJDUMP="${CSKY_PREFIX}objdump"

          sha256sum libs/libsysctrl.a | tee "$out/libsysctrl.sha256"
          "$AR" t libs/libsysctrl.a | tee "$out/archive-members.txt"
          (
            cd "$work"
            "$AR" x "$GITHUB_WORKSPACE/libs/libsysctrl.a"
          )

          find "$work" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee "$out/extracted-members.txt"
          cp "$work"/*.o "$out"/

          "$NM" -A -a -n -S libs/libsysctrl.a > "$out/libsysctrl-nm-address.txt"
          "$NM" -A -a -S --size-sort libs/libsysctrl.a > "$out/libsysctrl-nm-size.txt"
          "$READELF" -h -S -s -r -W libs/libsysctrl.a > "$out/libsysctrl-readelf.txt"
          "$OBJDUMP" -f -h -t -r -d libs/libsysctrl.a > "$out/libsysctrl-objdump.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('analysis-out/libsysctrl-objdump.txt').read_text(errors='replace')
          names = [
              'system_goto_boot',
              'system_reboot_test_mode',
              'system_reboot_normal_mode',
              'system_reset_boot',
              'mcu_reset',
              'mcu_reset2',
              'pmu_reg_reset',
              'system_is_wifi_test_mode',
          ]
          for name in names:
              m = re.search(rf'(?ms)^([0-9a-f]+ <{re.escape(name)}>:\n.*?)(?=^[0-9a-f]+ <[^>]+>:\n|\Z)', src)
              Path(f'analysis-out/{name}.txt').write_text(m.group(1) if m else f'{name}: symbol block not found\n')
          PY

          grep -n -E 'system_goto_boot|PMUCON7|40018034|reboot_(test|normal)_mode|system_reset_boot|mcu_reset' "$out/libsysctrl-objdump.txt" > "$out/high-value-grep.txt" || true

      - name: Upload analysis bundle
        uses: actions/upload-artifact@v4
        with:
          name: txw817-libsysctrl-analysis
          path: analysis-out/
          if-no-files-found: error
          retention-days: 7
