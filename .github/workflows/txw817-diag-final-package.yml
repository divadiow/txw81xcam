name: TXW817 diagnostic final package

on:
  push:
    branches:
      - txw817-diag-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct diagnostic raw image and Intel HEX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem -LiteralPath 'diag_input' -Filter 'raw.b64.*' | Sort-Object Name
          if (-not $chunks) { throw 'No diag_input/raw.b64.* chunks exist' }
          $joined = ($chunks | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          $raw = [Convert]::FromBase64String($joined)
          New-Item -ItemType Directory -Force -Path final_build | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'final_build/txw817_diag_raw.bin'), $raw)
          if ($raw.Length -lt 1024) { throw "Raw diagnostic image is implausibly small: $($raw.Length)" }
          @'
          from pathlib import Path
          data = Path('final_build/txw817_diag_raw.bin').read_bytes()
          base = 0x18000000
          def rec(addr, typ, payload):
              body = bytes([len(payload), (addr >> 8) & 0xff, addr & 0xff, typ]) + payload
              chk = (-sum(body)) & 0xff
              return ':' + (body + bytes([chk])).hex().upper()
          out=[]
          current_upper=None
          for off in range(0, len(data), 16):
              absolute=base+off
              upper=(absolute >> 16) & 0xffff
              if upper != current_upper:
                  out.append(rec(0, 4, upper.to_bytes(2,'big')))
                  current_upper=upper
              out.append(rec(absolute & 0xffff, 0, data[off:off+16]))
          out.append(rec(0, 1, b''))
          Path('final_build/project.hex').write_text('\n'.join(out)+'\n', encoding='ascii')
          Path('final_build/raw_size.txt').write_text(str(len(data)), encoding='ascii')
          '@ | python -
          Get-FileHash final_build/txw817_diag_raw.bin -Algorithm SHA256 | Format-List | Out-File final_build/raw_sha256.txt

      - name: Run Taixin vendor packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath project -Destination final_build/vendor -Recurse -Force
          Copy-Item -LiteralPath final_build/project.hex -Destination final_build/vendor/project.hex -Force
          Push-Location final_build/vendor
          try {
            if (Test-Path 'parameter.bincfg') { Copy-Item 'parameter.bincfg' 'parameter.cfg' -Force }
            elseif (-not (Test-Path 'parameter.cfg')) { throw 'Neither parameter.bincfg nor parameter.cfg exists' }
            $before = Get-ChildItem -Recurse -File | Select-Object -ExpandProperty FullName
            & .\BinScript.exe .\BinScript.BinScript *>&1 | Tee-Object -FilePath ..\binscript.log
            $binScriptExit = $LASTEXITCODE
            if ($binScriptExit -ne 0) { throw "BinScript.exe failed with exit $binScriptExit" }
            if (-not (Test-Path 'txw81x_fpv.bin')) { throw 'BinScript did not create txw81x_fpv.bin' }
            & .\makecode.exe *>&1 | Tee-Object -FilePath ..\makecode.log
            $makeCodeExit = $LASTEXITCODE
            if ($makeCodeExit -ne 0) { throw "makecode.exe failed with exit $makeCodeExit" }
            Get-ChildItem -Recurse -File | Sort-Object LastWriteTime | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-File ..\vendor_files.txt -Width 260
          }
          finally { Pop-Location }

      - name: Select packaged programmer image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import hashlib, json, re
          root=Path('final_build/vendor')
          raw=Path('final_build/txw817_diag_raw.bin')
          raw_size=raw.stat().st_size
          excluded={
              'txw81x_fpv.bin','param.bin','loader_compress.bin','txw817_diag_raw.bin'
          }
          cands=[]
          for p in root.rglob('*.bin'):
              if p.name.lower() in excluded:
                  continue
              size=p.stat().st_size
              if size < 1024:
                  continue
              data=p.read_bytes()
              score=0
              name=p.name.lower()
              if any(x in name for x in ('download','firmware','flash','code','merge','pack','all')): score+=5
              if size > raw_size: score+=4
              if b'TXWDIAG' in data: score+=6
              if data[:2] in (b'Zi', b'Z\x69'): score+=2
              cands.append((score,size,p))
          # Also consider txw81x_fpv.bin only as a fallback packaging-stage image.
          fpv=root/'txw81x_fpv.bin'
          if fpv.exists():
              data=fpv.read_bytes()
              cands.append((3 + (6 if b'TXWDIAG' in data else 0), fpv.stat().st_size, fpv))
          if not cands:
              raise SystemExit('No plausible packaged binary was produced')
          cands.sort(key=lambda x:(x[0],x[1]), reverse=True)
          score,size,best=cands[0]
          out=Path('final_build/TXW817_810_DIAG_FLASH.bin')
          out.write_bytes(best.read_bytes())
          Path('final_build/selected_source.txt').write_text(str(best),encoding='utf-8')
          Path('final_build/selection.json').write_text(json.dumps({
             'source':str(best),'score':score,'size':size,
             'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
             'all_candidates':[{'score':s,'size':z,'path':str(p)} for s,z,p in cands]
          },indent=2),encoding='utf-8')
          if out.stat().st_size < 1024:
              raise SystemExit('Selected image is too small')
          '@ | python -

      - name: Upload complete packaging result
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-final-package
          path: final_build
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
