name: TXW817 final diagnostic package

on:
  push:
    branches:
      - txw817-diag-build
    paths:
      - 'diag_input/raw.b64.*'
      - '.github/workflows/txw817-final-package.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'diag_input/raw.b64.*'
      - '.github/workflows/txw817-final-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct validated linked image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $chunks = Get-ChildItem -Path 'diag_input/raw.b64.*' | Sort-Object Name
          if ($chunks.Count -ne 8) { throw "Expected 8 image chunks, found $($chunks.Count)" }
          $b64 = (($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('work/TXW817_810_DIAG.raw.bin', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'work/TXW817_810_DIAG.raw.bin' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f489879730eac26ccdf502f9ec0dda17361de4eef85a80654e62ee9e1586c8cf') {
            throw "Raw image SHA-256 mismatch: $hash"
          }
          if ((Get-Item 'work/TXW817_810_DIAG.raw.bin').Length -ne 15748) {
            throw 'Raw image length mismatch'
          }

      - name: Convert raw image to Intel HEX at 0x18000000
        shell: python
        run: |
          from pathlib import Path

          data = Path('work/TXW817_810_DIAG.raw.bin').read_bytes()
          base = 0x18000000

          def rec(addr, typ, payload):
              body = bytes((len(payload), (addr >> 8) & 0xff, addr & 0xff, typ)) + payload
              cks = (-sum(body)) & 0xff
              return ':' + (body + bytes((cks,))).hex().upper()

          lines = [rec(0, 4, (base >> 16).to_bytes(2, 'big'))]
          for off in range(0, len(data), 16):
              lines.append(rec((base + off) & 0xffff, 0, data[off:off + 16]))
          lines.append(rec(0, 5, (0x18000980).to_bytes(4, 'big')))
          lines.append(rec(0, 1, b''))
          Path('work/project.hex').write_text('\r\n'.join(lines) + '\r\n', encoding='ascii')

      - name: Prepare Taixin packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item project/BinScript.exe work/
          Copy-Item project/BinScript.BinScript work/
          Copy-Item project/makecode.exe work/
          Copy-Item project/makecode.ini work/
          Copy-Item project/parameter.bincfg work/
          Copy-Item project/parameter.bincfg work/parameter.cfg
          Copy-Item project/loader_compress.bin work/
          Copy-Item project/merge.bat work/
          New-Item -ItemType Directory -Force -Path work/Lst,work/Obj | Out-Null
          Copy-Item 'work/TXW817_810_DIAG.raw.bin' 'work/Obj/TXW817_810_DIAG.bin'

      - name: Run Taixin BinScript and makecode
        shell: cmd
        working-directory: work
        run: |
          @echo on
          BinScript.exe BinScript.BinScript > binscript.log 2>&1
          if errorlevel 1 exit /b %errorlevel%
          makecode.exe > makecode.log 2>&1
          if errorlevel 1 exit /b %errorlevel%

      - name: Validate flashable APP.bin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem work -Recurse | Sort-Object FullName | Format-Table FullName,Length -AutoSize | Out-String -Width 220 | Set-Content work/files.txt
          if (-not (Test-Path work/APP.bin)) { throw 'Taixin makecode did not produce APP.bin' }
          $app = Get-Item work/APP.bin
          if ($app.Length -lt 4096) { throw "APP.bin is implausibly small: $($app.Length) bytes" }
          if (-not (Test-Path work/program.bin)) { throw 'merge.bat did not produce program.bin' }
          if (-not (Test-Path work/txw81x_fpv.bin)) { throw 'BinScript did not produce txw81x_fpv.bin' }
          if (-not (Test-Path work/param.bin)) { throw 'BinScript did not produce param.bin' }
          if ((Get-Item work/txw81x_fpv.bin).Length -ne 15748) { throw 'txw81x_fpv.bin length differs from linked image' }
          $linkedHash = (Get-FileHash work/TXW817_810_DIAG.raw.bin -Algorithm SHA256).Hash
          $convertedHash = (Get-FileHash work/txw81x_fpv.bin -Algorithm SHA256).Hash
          if ($linkedHash -ne $convertedHash) { throw 'BinScript code conversion altered the linked image' }
          Copy-Item work/APP.bin work/TXW817_810_DIAG_APP.bin

      - name: Upload packaging result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diagnostic-packaging-result
          path: |
            work/APP.bin
            work/TXW817_810_DIAG_APP.bin
            work/program.bin
            work/txw81x_fpv.bin
            work/param.bin
            work/TXW817_810_DIAG.raw.bin
            work/project.hex
            work/binscript.log
            work/makecode.log
            work/files.txt
          if-no-files-found: warn
          retention-days: 7
