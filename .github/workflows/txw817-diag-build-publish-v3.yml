name: Build and publish TXW817 diagnostic firmware v3

on:
  push:
    branches:
      - txw817-diag-build
    paths-ignore:
      - 'diag/prebuilt/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-elf:
    if: ${{ !contains(github.event.head_commit.message, '[skip txwdiag]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: txw817-diag-build
          fetch-depth: 0

      - name: Download isolated C-SKY ABIv2 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          TOOLROOT="$RUNNER_TEMP/csky-toolchain"
          mkdir -p "$TOOLROOT"
          curl --fail --location --retry 5 \
            'https://github.com/openLuat/luatos-soc-air101/releases/download/v2001.gcc/csky-elfabiv2-tools-x86_64-minilibc-20230301.zip' \
            -o "$TOOLROOT/toolchain.zip"
          unzip -q "$TOOLROOT/toolchain.zip" -d "$TOOLROOT"
          find "$TOOLROOT" -type f -name 'csky*' -exec chmod +x {} + || true
          GCC_PATH="$(find "$TOOLROOT" -type f \( -name 'csky-abiv2-elf-gcc' -o -name 'csky-elfabiv2-gcc' \) | head -n 1)"
          test -n "$GCC_PATH"
          echo "$(dirname "$GCC_PATH")" >> "$GITHUB_PATH"
          "$GCC_PATH" --version

      - name: Compile, link and validate diagnostic firmware
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf diag/out
          python3 diag/build_diag.py
          test -s diag/out/SUCCESS
          test -s diag/out/txw817_810_diag_v0.1.elf
          test -s diag/out/txw817_810_diag_v0.1.hex
          test -s diag/out/txw817_810_diag_v0.1.raw.bin

      - uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-elf-v3
          path: diag/out/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-build-v3-failure
          path: diag/out/
          if-no-files-found: ignore
          retention-days: 30

  package-and-publish:
    needs: build-elf
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: txw817-diag-build
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: txw817-diag-elf-v3
          path: diag-build

      - name: Package with Taixin BinScript.exe and makecode.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          Copy-Item 'diag-build\txw817_810_diag_v0.1.hex' 'project\project.hex' -Force
          if (Test-Path 'project\parameter.bincfg') {
              Copy-Item 'project\parameter.bincfg' 'project\parameter.cfg' -Force
          }
          Push-Location project
          try {
              & .\BinScript.exe .\BinScript.BinScript
              if ($LASTEXITCODE -ne 0) { throw "BinScript.exe failed: $LASTEXITCODE" }
              if (-not (Test-Path .\txw81x_fpv.bin)) { throw 'BinScript did not create txw81x_fpv.bin' }
              & .\makecode.exe
              if ($LASTEXITCODE -ne 0) { throw "makecode.exe failed: $LASTEXITCODE" }
          }
          finally { Pop-Location }

          Remove-Item 'diag\prebuilt' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'diag\prebuilt' | Out-Null
          Copy-Item 'diag-build\*' 'diag\prebuilt\' -Force
          Get-ChildItem project -File | Where-Object {
              $_.Extension -in '.bin','.hex','.cfg','.ini','.txt','.log' -and
              ($_.LastWriteTime -ge $start.AddSeconds(-5) -or $_.Name -in 'txw81x_fpv.bin','param.bin','project.hex')
          } | ForEach-Object {
              Copy-Item $_.FullName ('diag\prebuilt\vendor_' + $_.Name) -Force
          }
          $files = Get-ChildItem 'diag\prebuilt' -File
          if (-not ($files | Where-Object Extension -eq '.bin')) { throw 'No BIN product collected' }
          $manifest = [ordered]@{
              target = 'TXW817/TXW810 using TXW81x SDK and CHIP_ID 0x8410 packaging profile'
              build_validated = $true
              vendor_packers_completed = $true
              hardware_validated = $false
              generated_utc = (Get-Date).ToUniversalTime().ToString('o')
              workflow_source_commit = '${{ github.sha }}'
              files = @($files | ForEach-Object {
                  [ordered]@{
                      name = $_.Name
                      length = $_.Length
                      sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
                  }
              })
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 'diag\prebuilt\manifest.json'
          Get-ChildItem 'diag\prebuilt' | Format-Table Name,Length,LastWriteTime -AutoSize

      - name: Publish validated artifacts on development branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin txw817-diag-build
          git add -- 'diag/prebuilt'
          if (-not (git diff --cached --quiet)) {
              git commit -m 'Publish TXW817 diagnostic build [skip txwdiag]'
              git push origin HEAD:txw817-diag-build
          }

      - uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-complete-v3
          path: diag/prebuilt/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-package-v3-failure
          path: |
            diag-build/
            project/*.log
            project/*.txt
            project/*.ini
            project/*.bin
          if-no-files-found: ignore
          retention-days: 30
