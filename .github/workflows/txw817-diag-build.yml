name: Build TXW817 diagnostic firmware

on:
  push:
    branches:
      - txw817-diag-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      - name: Download C-SKY ABIv2 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _toolchain
          curl --fail --location --retry 5 \
            'https://github.com/openLuat/luatos-soc-air101/releases/download/v2001.gcc/csky-elfabiv2-tools-x86_64-minilibc-20230301.zip' \
            -o _toolchain/toolchain.zip
          unzip -q _toolchain/toolchain.zip -d _toolchain
          find _toolchain -type f -name 'csky*' -exec chmod +x {} + || true
          find _toolchain -type f -name '*gcc' -print

      - name: Build and validate C-SKY ELF
        shell: bash
        run: |
          set -euxo pipefail
          python3 diag/build_diag.py
          test -s diag/out/txw817_810_diag_v0.1.elf
          test -s diag/out/txw817_810_diag_v0.1.hex
          test -s diag/out/txw817_810_diag_v0.1.raw.bin
          test -s diag/out/SUCCESS

      - name: Upload validated ELF build
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-elf
          path: diag/out/
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-build-failure
          path: diag/out/
          if-no-files-found: ignore
          retention-days: 14

  vendor-package:
    needs: build-elf
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out SDK and vendor packers
        uses: actions/checkout@v4

      - name: Download validated ELF build
        uses: actions/download-artifact@v4
        with:
          name: txw817-diag-elf
          path: diag-build

      - name: Run Taixin BinScript and makecode packers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          Copy-Item -LiteralPath 'diag-build\txw817_810_diag_v0.1.hex' -Destination 'project\project.hex' -Force
          if (Test-Path 'project\parameter.bincfg') {
              Copy-Item 'project\parameter.bincfg' 'project\parameter.cfg' -Force
          }
          Push-Location project
          try {
              & .\BinScript.exe .\BinScript.BinScript
              if ($LASTEXITCODE -ne 0) { throw "BinScript.exe failed: $LASTEXITCODE" }
              if (-not (Test-Path .\txw81x_fpv.bin)) { throw 'BinScript did not produce txw81x_fpv.bin' }
              & .\makecode.exe
              if ($LASTEXITCODE -ne 0) { throw "makecode.exe failed: $LASTEXITCODE" }
          }
          finally {
              Pop-Location
          }
          New-Item -ItemType Directory -Force -Path packaged | Out-Null
          Copy-Item diag-build\* packaged\ -Force
          Get-ChildItem project -File | Where-Object {
              $_.Extension -in '.bin','.hex','.cfg','.ini','.txt','.log' -and
              ($_.LastWriteTime -ge $start.AddSeconds(-5) -or $_.Name -in 'txw81x_fpv.bin','param.bin','project.hex')
          } | Copy-Item -Destination packaged -Force
          $bins = Get-ChildItem packaged -File -Filter *.bin
          if (-not $bins) { throw 'Vendor packaging produced no BIN files' }
          $manifest = [ordered]@{
              build_validated = $true
              vendor_packers_completed = $true
              hardware_validated = $false
              generated_utc = (Get-Date).ToUniversalTime().ToString('o')
              files = @($bins | ForEach-Object {
                  [ordered]@{
                      name = $_.Name
                      length = $_.Length
                      sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
                  }
              })
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 packaged\vendor_packaging_manifest.json
          Get-ChildItem packaged | Format-Table Name,Length,LastWriteTime -AutoSize

      - name: Upload Taixin-packaged diagnostic firmware
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-complete
          path: packaged/
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: txw817-diag-packaging-failure
          path: |
            diag-build/
            project/*.log
            project/*.txt
            project/*.ini
            project/*.bin
          if-no-files-found: ignore
          retention-days: 14
